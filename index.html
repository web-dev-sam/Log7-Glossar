<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glossar | Log7 Consult GmbH</title>

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/solid.min.css"
        integrity="sha512-6mc0R607di/biCutMUtU9K7NtNewiGQzrvWX4bWTeqmljZdJrwYvKJtnhgR+Ryvj+NRJ8+NnnCM/biGqMe/iRA=="
        crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="index.css">

    <script src="index.js" type="module"></script>
</head>

<body>
    <aside role="region" aria-label="Glossar Navigation">
        <div class="logo-wrapper" onclick="location = '#'" aria-hidden="true">
            <img src="assets/logo.svg" height="70" alt="Log7 Consult GmbH">
        </div>
        <input id="article-search" aria-label="Suche" name="article-search" type="text" placeholder="Suchen... (Strg+P)">
        <nav id="article-nav" tabindex="0" role="navigation" aria-label="Glossar Begriffe">
            <ul></ul>
        </nav>
    </aside>
    <main>
        <div id="article-wrapper" tabindex="1" aria-live="polite" role="region" aria-label="Begriff Definition">
            <term-article></term-article>
        </div>
        <template id="main-article-template">
            <article>
                <h1 class="center">Glossar</h1>
                <p class="center">
                    Willkommen in unserem internen Glossar für Logistikbegriffe!
                    Bei der Erbringung logistischer Beratungsleistungen für unsere Kunden verwenden wir eine Vielzahl
                    von Fachbegriffen und Ausdrücken.
                    Dieses Glossar soll unseren Teammitgliedern als Nachschlagewerk dienen und klare und einheitliche
                    Definitionen für die Begriffe liefern, die wir täglich verwenden.
                </p>
            </article>
        </template>
        <template id="term-article-template">
            <article>
                <div class="sub-nav" tabindex="4" role="navigation" aria-label="Vor und Zurück">
                    <a class="prev" tabindex="5" role="link" aria-label="Vorheriger Begriff"><i class="fa-solid hover-opacity fa-arrow-left"></i></a>
                    <a class="next" tabindex="6" role="link" aria-label="Nächster Begriff"><i class="fa-solid hover-opacity fa-arrow-right"></i></a>
                </div>
                <div class="breadcrumbs" tabindex="7" role="navigation" aria-label="Kategorien des Begriffs"></div>
                <div class="title-area">
                    <h2 class="title" tabindex="2" role="heading" aria-label="Begriff"></h2>
                    <h2>
                        <i tabindex="-1" class="fa-solid edit-icon hover-opacity fa-pen" onclick="window.app.termArticleElement.editArticle()"></i>
                        <i tabindex="-1" class="fa-solid delete-icon hover-opacity fa-trash" onclick="window.app.termArticleElement.deleteArticle()"></i>
                    </h2>
                </div>
                <p class="content" tabindex="3" role="definition"></p>
            </article>
        </template>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/js/all.min.js"
        integrity="sha512-rpLlll167T5LJHwp0waJCh3ZRf7pO6IT1+LZOhAyP6phAirwchClbTZV3iqL3BMrVxIYRbzGTpli4rfxsCK6Vw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>

</html>
